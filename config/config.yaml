# Central configuration. Modules read parameters from here instead of hardcoding them.

project:
  name: deforestation-detection-sentinel2
  random_seed: 42

aoi:
  name: rondonia_candidate_1
  # [min_lon, min_lat, max_lon, max_lat] in EPSG:4326 (about 20 km x 20 km).
  # Shifted 0.02 degrees east of the first version so the AOI no longer touches the
  # WorldCover tile boundary at -63.0 degrees longitude.
  bbox_wgs84: [-62.98, -10.30, -62.80, -10.12]
  # UTM zone 20S, confirmed by the STAC probe for tile 20LNP.
  expected_crs: "EPSG:32720"

stac:
  url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  sentinel2_collection: "sentinel-2-l2a"
  worldcover_collection: "esa-worldcover"

search:
  max_cloud_cover: 30        # scene-wide percentage; AOI-specific cover is checked separately
  top_n_report: 5
  # Dry-season windows for Rondonia so both dates are comparable.
  windows:
    - label: date_a_2021
      start: "2021-06-15"
      end: "2021-09-15"
    - label: date_b_2025
      start: "2025-06-15"
      end: "2025-09-15"
  worldcover_datetime: "2020-01-01/2021-12-31"

# Scenes chosen from the STAC probe: same MGRS tile (20LNP), same relative orbit (R053),
# both in July (same season), lowest scene-wide cloud cover.
scenes:
  date_a:
    item_id: "S2B_MSIL2A_20210709T142729_R053_T20LNP_20210710T065653"
  date_b:
    item_id: "S2C_MSIL2A_20250713T142811_R053_T20LNP_20250713T195215"

worldcover:
  # Substring that selects the product: 2021, version 2.0.0 (v200).
  item_id_contains: "2021_v200"
  forest_class: 10           # ESA WorldCover class 10 = "Tree cover"

preprocessing:
  # Scene Classification Layer classes treated as unusable:
  # 0 no data, 1 saturated/defective, 3 cloud shadow, 7 unclassified,
  # 8 cloud (medium probability), 9 cloud (high probability), 10 thin cirrus, 11 snow/ice
  invalid_scl_classes: [0, 1, 3, 7, 8, 9, 10, 11]
  # Surface reflectance is clipped to this range after scaling and offset correction.
  reflectance_clip: [0.0, 1.0]
  # Fail if more than this fraction of the AOI has no WorldCover label after reprojection.
  max_label_nodata_fraction: 0.01

dataset:
  train_date: date_a          # the WorldCover 2021 labels belong to Date A
  patch_size: 256
  train_stride: 64            # overlapping patches inside training blocks
  eval_stride: 256            # non-overlapping patches inside validation and test blocks
  block_buffer_px: 64         # trimmed from each block edge that touches another block
  max_invalid_fraction: 0.2   # skip patches where more than this fraction is masked or unlabelled
  batch_size: 8
  num_workers: 0              # simplest and most reliable on Windows
  # Spatial blocks: nw = north-west, ne = north-east, sw = south-west, se = south-east.
  # PROVISIONAL until the per-block statistics have been reviewed.
  split:
    train: [nw, sw]
    val: [se]
    test: [ne]